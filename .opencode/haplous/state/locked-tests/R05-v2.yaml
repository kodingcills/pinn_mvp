schema_version: "haplous.locked-test.v1"
test_id: "R05-v2"
title: "Execution value of physics-integrated antipodal probing and filtered re-centering"
status: "preregistered_not_run"
supersedes: "R05-v1 (never executed; superseded PRE-CONFIRMATORY by the independent runner preflight review, which found the v1 rng_streams section self-contradictory with the balanced strata clauses and identified unenforced G3/G7/G9, z_flat-relative grading, and production-only peak-force selection). Hypothesis, arms, margins, envelopes, and analysis are UNCHANGED from v1."
runner_review: "oracle preflight returned FIX_FIRST; all blocker fixes are folded into this re-lock. v1 is preserved as the historical record of the design process."
locked_on: "2026-09-08"
red_team_review: "oracle red-team returned REDESIGN; blocking fixes were applied PRE-LOCK in this file (statistics wording, sacrificial-insertion estimand, quantitative K1, new K5/K6 risks, budget caps, operational-completion spec, G8 evidence fingerprints, G9 throughput gate, RNG stream spec). The unfixable design-level findings (off-center observation model, shared truth-triggered capture) are registered as preregistered predictions/risks K5 and K6 and deferred findings, not repaired under R05-v1."
repository: "/Users/tofuinparis/Projects/pinn_mvp"

lock_contract:
  immutable_after_first_confirmatory_result: true
  allowed_post_lock_edits: []
  replacement_rule: >-
    Any change to the hypothesis, arms, scenario generator, primary outcome,
    margin, or analysis requires a new R05-v2 file. Results produced under this
    file must not be pooled with a later version.
  evidence_state_rule: >-
    Record the repository commit and hashes of this YAML, the generated
    development manifest, the frozen selected-arm configuration, and the
    held-out manifest in the execution report before running confirmatory arms.
  no_simulation_was_run_to_create_this_design: true

research_question: >-
  Does the current pegsim probing/filter execution path create material
  production-insertion value over the strongest simpler practical spiral
  baseline under the locked variation challenge set?

hypothesis:
  primary_claim: >-
    On the 80 paired held-out scenarios defined below, Haplous will produce at
    least 0.10 absolute MORE observed paired seating successes than the tuned
    VALIDATED_LOOSE_V1 spiral baseline (n10 - n01 >= 8 of 80), and the
    direction of the paired discordances will reject equal success probability
    by a one-sided exact McNemar test at alpha=0.05. This is a claim about the
    locked benchmark result, not an inference that the underlying effect
    exceeds 0.10 in a sampling population (see statistical_analysis.estimand_note).
  null_for_test: >-
    Conditional on a discordant scenario, Haplous is no more likely than the
    baseline to be the successful arm: P(Haplous-only success) <= 0.5.
  estimand: >-
    Intent-to-treat paired risk difference over the fixed 80-scenario challenge
    mixture: mean(H_i - B_i), where each arm receives the same exogenous
    scenario. Haplous executes up to six registered sacrificial full-insertion
    probe cycles before its one designated production insertion; the baseline
    executes its one designated production insertion directly. The estimand is
    the yield of the designated production insertion under each arm's
    registered procedure, NOT a physically attempt-matched comparison.
  material_margin_absolute: 0.10
  required_net_paired_successes_at_n_80: 8
  alpha_one_sided: 0.05

scope:
  claimed:
    - >-
      Comparative execution performance in deterministic MuJoCo at 2000 Hz for
      the locked n=64 blind-hole scene family and the exact fixture-offset,
      part-clearance, and sensor-corruption ranges below.
    - >-
      Added value, if any, of deliberate antipodal probes, the N5-measured pair
      covariance and bias, StateFilter gating/abort semantics, and re-centering
      one production insertion at the filter's fixture-position estimate.
    - >-
      A challenge-set result, not an estimate of customer or factory prevalence.
  not_claimed:
    - "Hardware performance, hardware safety, or 500/1000 Hz plausibility."
    - "Learning, natural-search observations, or end-to-end policy comparison."
    - "Angular fixture estimation, plate-tilt robustness, or bore-axis correction."
    - "General out-of-round bore robustness or odd-n facet behavior."
    - "Intra-pair fixture drift, batch adaptation, or multi-cycle production yield."
    - "Throughput superiority; probe and cycle-time costs are secondary outcomes."
  deliberate_exclusions:
    plate_tilt_deg: 0.0
    plate_tilt_reason: >-
      EpisodeConfig supports plate tilt, but the current three-state filter has
      no angular state and no measured execution envelope for tilt. Adding it
      would test a mechanism Haplous does not claim to correct.
    out_of_roundness: null
    out_of_roundness_reason: >-
      BoreOutOfRoundness exists in error_injection.py's analytic observation
      model, but scene.build_mjcf does not apply that harmonic to real MuJoCo
      bore geometry and no measured physical range is registered. It is not
      simulated or approximated here.

repository_evidence_basis:
  - path: "CONTEXT.md"
    facts:
      - "VALIDATED_LOOSE_V1 seats 16/16 at 2.0 mm; prior 96/96 spans 1.0-2.25 mm."
      - "R_passive is 1.5 mm; 0/8 at 1.75 mm."
      - "Spiral reach is 4.35 mm; 4.5 and 5.0 mm fail correctly."
      - "Canonical control is dt=0.0005 s, 2000 Hz, max_seconds=16.3 s."
  - path: "docs/N2_PROBE_PRIMITIVE_REPORT.md"
    facts:
      - "The search-disabled probe radius is exactly 2*0.5 mm=1.0 mm."
      - "128/128 probes seated when the probe itself was 1.0 mm from the true hole."
  - path: "docs/N5_ANTIPODAL_CANCELLATION_REPORT.md"
    facts:
      - "n=64 pair population: 768/768 seated and pair-mean max error 0.864 um at dc=0."
      - "Physical clearance offsets -10,-5,0,+5,+10 um were exercised."
      - "Pair error is strongly side-anticorrelated; the pair bias is a population mean."
  - path: "docs/F1C_PROBE_SESSION_REPORT.md"
    facts:
      - "Clean six-pair session ended at 0.024 um fixture error."
      - "3 um TCP translation +0.01 rad yaw and 2 um quantization tracked the bias exactly."
      - "The corrupted session produced NEES 226-407 and 2/6 gated pairs."
  - path: "pegsim/search.py"
    facts:
      - "DELTA_MAX_SPEC_M=0.002; canonical pitch=0.75 mm and R_spiral=2.75 mm."
  - path: "pegsim/filter.py"
    facts:
      - "Gate=13.816; ABORT occurs on the third consecutive gated pair."
  - path: "pegsim/probing.py"
    facts:
      - "Pair covariance and 1.1423 um n=64 pair bias are loaded from committed N5 evidence."
      - "An incomplete/unseated pair leaves the filter untouched."

