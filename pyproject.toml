[project]
name = "haplous"
description = "Haplous physical-execution runtime (stdlib only), with the pegsim simulation substrate, evaluation and Studio as extras"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dynamic = ["version"]
# The runtime is stdlib-only (tests/test_import_closure.py); everything else is an extra.
dependencies = []

[project.optional-dependencies]
# pegsim MuJoCo substrate, HEB MuJoCo backend, `haplous demo`.
sim = [
    "mujoco>=3.11.0,<3.12",  # evidence was produced on 3.11; MuJoCo 4 is untested here
    "numpy>=2.5.1",
]
# Evaluation and reporting (HEB, HES, M0 registry, replay): manifests, Parquet tables, plots.
eval = [
    "haplous[sim,registry,replay]",
    "matplotlib>=3.11.1",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
]
# M0 run registry: schema validation (with format checkers), RFC 8785, Ed25519.
registry = [
    "jsonschema[format-nongpl]>=4.23",
    "rfc8785>=0.1.4",
    "cryptography>=43",
]
# Recording replay: Arrow state stream and the derived Rerun .rrd view.
replay = [
    "pyarrow>=25.0.1",
    "rerun-sdk>=0.43.1",
    "mcap==1.6.0",
]
# Haplous Studio local server (`haplous studio`); httpx only for its tests.
studio = [
    "haplous[eval]",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]
# Development and CI tooling.
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Everything needed to run the full repository test suite.
all = [
    "haplous[eval,studio,dev]",
    "h5py>=3.11",
    "hypothesis>=6.100",
]

[project.scripts]
haplous = "haplous.cli:main"
hes = "hes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "haplous/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pegsim", "haplous", "evaluation", "benchmarks", "hes", "studio"]
exclude = ["studio/web"]

[tool.hatch.build.targets.sdist]
only-packages = false
exclude = [
    ".venv*",
    "dist",
    "results",
    "artifacts",
    "datasets",
    "UI",
    "data",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["results", "dist", "datasets", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Historical research scripts are not product code; keep lint meaningful
# for the shipped surface and the test suite.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["haplous", "hes", "evaluation/experiment.py", "evaluation/stats.py", "evaluation/aggregate.py"]
ignore_missing_imports = true
warn_unused_ignores = true
